<title>👁️ קמפוס חמ"ד — דף צפייה לצוות הניהול</title>
<style>
:root{
  color-scheme: light;
  --bg:#f5f6fb; --card:#fff; --ink:#1e2338; --muted:#6b7390;
  --line:#e4e7f0; --brand:#3b4a9e; --brand-soft:#eef1fc;
  --boy:#1e5f96; --boy-soft:#e8f1fb; --boy-line:#cfe1f4;
  --girl:#a8356e; --girl-soft:#fbeaf3; --girl-line:#f3d3e4;
  --mix:#6b4ba8; --mix-soft:#f1ecfa;
  --ok:#0f8a5f; --ok-soft:#e6f6ef; --warn:#b45309; --warn-soft:#fdf3e3;
  --bad:#c0392b; --bad-soft:#fdecea;
}
*{box-sizing:border-box}
body,button,input,select,table,th,td{font-family:'Open Sans','Segoe UI',Arial,Helvetica,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:20px;margin:0 0 2px;font-weight:800}
h2{font-size:16px;margin:0 0 4px;font-weight:700}
h3{font-size:13.5px;margin:16px 0 7px;font-weight:700;color:var(--brand)}
.sub{color:var(--muted);font-size:12.5px}
.cmp-ed{min-height:230px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;line-height:1.7;font-size:14px;outline:none}
.cmp-ed:focus{border-color:var(--brand)}
.cmp-tb{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.cmp-list{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.cmp-row{display:flex;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
.cmp-row.off{opacity:.55;cursor:default}
.cmp-gh{background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:12.5px;padding:5px 12px;position:sticky;top:0}
.btn.cmp-on{background:var(--brand)!important;color:#fff!important;border-color:var(--brand)!important;box-shadow:0 0 0 2px rgba(59,74,156,.25)}
.btn.cmp-on::before{content:'✓ ';font-weight:800}
.cmp-chosen{position:sticky;top:0;z-index:6;background:#fff;border:2px solid var(--brand);border-radius:12px;padding:8px 12px;margin:10px 0;box-shadow:0 4px 14px rgba(40,50,110,.18)}
.cmp-chip{display:inline-flex;align-items:center;gap:4px;background:var(--brand-soft);color:var(--brand);border-radius:99px;padding:2px 4px 2px 10px;margin:2px;font-size:12.5px;font-weight:600}
.cmp-chip button{border:0;background:transparent;color:var(--brand);cursor:pointer;font-size:15px;line-height:1;padding:0 4px}
.cmp-prev{background:#f5f6fb;border-radius:10px;padding:12px;overflow:auto;margin-top:10px}
.mlin{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;
  font-size:13px;line-height:1.6;background:#fff;color:var(--ink);resize:vertical;
  font-family:'Open Sans','Segoe UI',Arial,sans-serif}
.mlgrid{display:grid;grid-template-columns:1fr 220px;gap:12px}
@media(max-width:640px){.mlgrid{grid-template-columns:1fr}}
.mlsubj{font-size:12.5px;color:var(--muted);margin-bottom:9px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:11px 13px;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.lockline{font-size:11.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:5px 10px;display:inline-block;margin-top:6px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 14px}
nav button{border:1px solid var(--line);background:#fff;color:var(--muted);font-family:inherit;font-size:13px;
  font-weight:700;padding:8px 14px;border-radius:10px;cursor:pointer}
nav button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
nav button .b{background:rgba(0,0,0,.08);border-radius:99px;padding:0 6px;margin-inline-start:5px;font-size:11px}
nav button.on .b{background:rgba(255,255,255,.22)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
.kpi .v{font-size:27px;font-weight:800;line-height:1.1;color:var(--brand)}
.kpi .l{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.alert .v{color:var(--bad)} .kpi.good .v{color:var(--ok)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:13px}
.slot{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.slot-h{background:var(--brand);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline}
.slot-h b{font-size:15px} .slot-h span{font-size:12px;opacity:.85}
.slot-b{padding:13px;display:grid;gap:9px}
.gbox{border-radius:11px;padding:10px 12px;border:1px solid var(--line)}
.gbox.boys{background:var(--boy-soft);border-color:var(--boy-line)}
.gbox.girls{background:var(--girl-soft);border-color:var(--girl-line)}
.gbox .row1{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.gbox.boys .row1{color:var(--boy)} .gbox.girls .row1{color:var(--girl)}
.big{font-size:32px;font-weight:800;line-height:1;letter-spacing:-1px}
.bignum{display:flex;align-items:baseline;gap:5px}
.bignum i{font-style:normal;font-size:11px;font-weight:700;opacity:.75}
.cpill{display:inline-block;background:#fff;border-radius:99px;padding:2px 10px;
  font-weight:800;font-size:12px;border:1.5px solid currentColor}
.cpill.boys{color:var(--boy)} .cpill.girls{color:var(--girl)}
.cpill2{display:inline-block;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.08);
  border-radius:99px;padding:2px 9px;font-size:11.5px;color:var(--muted);margin-inline-start:4px}
.cpill2.bad{color:var(--bad);border-color:#f2c7c1;font-weight:700}
.schools{font-size:11px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed rgba(0,0,0,.13)}
.tot{display:flex;justify-content:space-between;background:var(--brand-soft);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:700;color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:12.7px}
th,td{padding:8px 9px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#f2f4fa;color:var(--muted);font-size:11.5px;font-weight:700}
tbody tr:hover{background:#fafbff}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;margin:1px}
.t-boy{background:var(--boy-soft);color:var(--boy)} .t-girl{background:var(--girl-soft);color:var(--girl)}
.t-mix{background:var(--mix-soft);color:var(--mix)} .t-slot{background:var(--brand-soft);color:var(--brand)}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)}
.t-bad{background:var(--bad-soft);color:var(--bad)}
.num{font-variant-numeric:tabular-nums;font-weight:700}
input[type=text]{border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12.5px;font-family:inherit;background:#fff;color:inherit}
.scroll{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:11px}
.empty{color:var(--muted);padding:18px;text-align:center}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;font-family:inherit;font-size:12.5px;font-weight:700;
  padding:6px 13px;border-radius:9px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--brand)}
.btn.mini{padding:3px 9px;font-size:11.5px}
.ev{position:relative;padding:10px 0 10px 0;border-bottom:1px dashed var(--line)}
.ev:last-child{border-bottom:0}
.ev .d{font-size:11.5px;color:var(--muted)} .ev .t{font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:13px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px}
.ccard2{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#fff}
.ccard2.school{border-inline-start:4px solid var(--brand)}
.cc-head{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:3px}
.cc-head b{font-size:13.5px}
.cc-line{font-size:12px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.crole{color:var(--muted);font-size:11px;background:#f4f6fc;border-radius:6px;padding:1px 6px;margin-inline-end:5px}
.cc{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.cc-main b{font-size:12.5px}
.cc-links{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.cbtn{display:inline-block;font-size:11.5px;text-decoration:none;background:var(--brand-soft);
  color:var(--brand);border:1px solid #d7deef;border-radius:7px;padding:3px 9px;font-weight:700}
.cbtn:hover{background:#e3e8fa}
.cbtn.wa{background:var(--ok-soft);color:var(--ok);border-color:#bfe6d4}
/* ---- לוח שיבוץ (תצוגה בלבד) ---- */
.aboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.acol{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fbfcff}
.acolh{background:var(--brand);color:#fff;padding:9px 12px;display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.acolh span{opacity:.85;font-size:12px}
.acell{padding:9px;border-bottom:1px solid var(--line)}
.acell:last-child{border-bottom:0}
.acell.boys{background:var(--boy-soft)} .acell.girls{background:var(--girl-soft)}
.ahead{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:12.5px;margin-bottom:7px}
.acell.boys .ahead>span:first-child{color:var(--boy)} .acell.girls .ahead>span:first-child{color:var(--girl)}
.aempty{font-size:11.5px;color:var(--muted);text-align:center;padding:8px;border:1px dashed var(--line);border-radius:8px;background:rgba(255,255,255,.5)}
.ccard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:7px}
.ccard.q{border-inline-start:3px solid var(--warn)}
.ccard .cname{font-weight:700;font-size:12.5px;line-height:1.3}
.ccard .crow{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.aschools{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.stag{background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.07);border-radius:7px;
  padding:2px 7px;font-size:10.5px;color:var(--muted)}
.stag b{color:var(--ink)} .stag i{font-style:normal;opacity:.65;font-size:9.5px}
.apool{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px}
.tt td{vertical-align:top}
.signature{direction:rtl;text-align:center;font-size:12px;line-height:1.8;padding:18px 12px;margin-top:8px;opacity:.72;color:var(--muted);border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">

  <div class="card topbar">
    <div>
      <h1>קמפוס חמ"ד — דף צפייה לצוות הניהול</h1>
      <div class="sub" id="src">טוען נתונים מגיליון ההרשמות…</div>
      <div class="lockline">🔒 דף פנימי לצוות הניהול בלבד — כולל פרטי קשר של מורים. אין להפיץ הלאה בלי אישור.</div>
    </div>
    <button class="btn ghost" id="btnSync">🔄 רענון מהגיליון</button>

  <div id="err"></div>
  <div id="offbar"></div>
  <nav id="nav"></nav>

    <span class="sig-name">קמפוס חמ"ד מחוז חיפה — למידה שפוגשת את התשוקה לדעת</span>
  </footer>
</div>

<script>
/* =====================================================================
   דף צפייה בלבד לצוות הניהול — קמפוס חמ"ד תשפ"ז
   נגזר מ-index-מקומי.html ב-17.9.2026, עודכן שוב באותו יום כדי שהלשוניות
   והמראה יתאימו בדיוק ללוח הניהול המקומי: דשבורד, לוח שיבוץ (אותו לוח
   ויזואלי בדיוק — עמודות לפי רצועה, תאים לפי מגדר, כרטיסי קורס), קורסים
   ובתי ספר, מצבת מורים (שעות), אנשי קשר. ההבדל היחיד מהמערכת המקומית:
   כל הבקרות (סלקטים/כפתורי עריכה/סנכרון) הוסרו — זהו עמוד קריאה בלבד,
   שקורא ישירות מהגיליון בכל טעינה ולעולם לא כותב אליו.
   ===================================================================== */
const FILE_ID='1a7xr86kil66yseNre1cHpFNPj3UYdmY7Zb3arvDh_X8';
const LUZ_ID='1InhH9b560aPLX2TE5zbXo21Qf6ZjuijQ1H1F_9e_mSI';
const LUZ_URL='https://docs.google.com/spreadsheets/d/'+LUZ_ID+'/edit';
const GS=20; // גודל קבוצה מרבי — לתצוגה בלבד, תואם את ברירת המחדל במערכת הניהול
function GVIZOF(key){
  return {
    regs:    {id:FILE_ID, sheet:'תגובות לטופס 1'},
    teachers:{id:FILE_ID, sheet:'מורים-לפרסום'},
    courses: {id:FILE_ID, gid:'241967168'},
    master:  {id:FILE_ID, gid:'611332690'},
    assign:  {id:FILE_ID, sheet:'שיבוץ קורסים'},
    team:    {id:FILE_ID, sheet:'צוות ניהול'},
    settings:{id:FILE_ID, sheet:'הגדרות'},
    contacts:{id:FILE_ID, sheet:'אנשי קשר מסודר'},
    luz:     {id:LUZ_ID,  gid:'684316836'}
  }[key];
}
let __jsonpN=0;
function jsonpTable(g,headers){
  return new Promise((resolve,reject)=>{
    const cb='chemedViewCB'+(__jsonpN++)+'_'+Date.now();
    const timer=setTimeout(()=>{cleanup();reject(new Error('פסק זמן בתגובה מגוגל'))},15000);
    function cleanup(){ try{delete window[cb]}catch(e){window[cb]=undefined}
      const el=document.getElementById(cb); if(el)el.remove(); clearTimeout(timer); }
    window[cb]=function(resp){ cleanup();
      if(!resp||resp.status==='error'){
        reject(new Error((resp&&resp.errors&&resp.errors[0]&&resp.errors[0].detailed_message)||'שגיאה בקריאת הגיליון'));
        return;}
      resolve(resp.table); };

const LUZ_MONTHS={'ספטמבר':[2026,9],'אוקטובר':[2026,10],'נובמבר':[2026,11],'דצמבר':[2026,12],
  'ינואר':[2027,1],'פברואר':[2027,2],'מרץ':[2027,3],'אפריל':[2027,4],'מאי':[2027,5],'יוני':[2027,6]};

function parseLuzGrid(text){
  const rows=text.split('\n').map(l=>l.trim()).filter(l=>l.startsWith('|'))
    .map(l=>l.replace(/^\|/,'').replace(/\|$/,'').split('|')
      .map(c=>c.trim().replace(/\\/g,'').replace(/\[merged\]/g,'').replace(/\s+/g,' ').trim()))
    .filter(r=>!r.every(c=>/^:?-+:?$/.test(c)||c===''));
  const hits={};
  rows.forEach((r,i)=>{
    const m=LUZ_MONTHS[(r[0]||'').trim()]; if(!m) return;
    let c0=-1; for(let c=1;c<r.length;c++){ if(r[c]==='1'){c0=c;break;} }
    if(c0<0) return;
    const d0=new Date(Date.UTC(m[0],m[1]-1,1));
    for(let j=i+1;j<rows.length && !(rows[j][0]||'').trim();j++){
      for(let c=1;c<rows[j].length;c++){
        const t=rows[j][c]; if(!t) continue;
        const d=new Date(d0.getTime()+(c-c0)*864e5);
        const key=d.toISOString().slice(0,10);
        (hits[key]=hits[key]||[]).push(t);
      }
    }
  });
  const out=[];
  Object.keys(hits).sort().forEach(k=>{
    let ts=[...new Set(hits[k])].filter(t=>!LUZ_HOL.some(h=>t.includes(h)));
    if(!ts.length) return;
    let t;
    if(ts.length>1){
      const nums=ts.map(x=>/שיעור (\d+)/.exec(x));
      if(nums.every(Boolean)){
        const sem=ts[0].includes("סמ' א")?"סמ' א":"סמ' ב";
        t='שיעור '+nums.map(x=>+x[1]).sort((a,b)=>a-b).join('/')+' ('+sem+') — לאימות';
      } else t=ts.join(' / ');
    } else t=ts[0];
    const c=/^שיעור \d|^שיעור \d+\//.test(t)?'שיעור':/כנס|האקתון/.test(t)?'כנס':
            /הערכות/.test(t)?'הערכות':/ציונים|תעודות/.test(t)?'ציונים':
            /^שיעור/.test(t)?'פתיחה':'אירוע';

    out.push({d:k,t,c,h:(c==='כנס'||c==='פתיחה')?'09:30–15:30':'',l:'קמפוס חמ"ד'});
  });
  return out;
}

function matchMaster(n0){const n=norm(n0),a=ALIASES[n];
  if(a){const m=MASTER.find(x=>norm(x.name).includes(a));if(m)return m}
  let e=MASTER.find(x=>norm(x.name)===n);if(e)return e;
  let i=MASTER.find(x=>norm(x.name).includes(n)||n.includes(norm(x.name)));if(i)return i;
  const stop=new Set(['תיכון','ישיבת','ישיבה','תיכונית','אולפנת','אולפנית','של','בית','ספר','חמד','שש','שנתי','עש']);
  const tk=n.split(' ').filter(t=>t.length>1&&!stop.has(t));let b=null,bs=0;
  MASTER.forEach(m=>{const mt=norm(m.name).split(' ');
    const s=tk.filter(t=>mt.some(x=>x.includes(t)||t.includes(x))).length; if(s>bs){bs=s;b=m}});
  return bs>=2?b:null;}
function genderOf(r){ const m=matchMaster(r.name);
  if(m){const g=m.gender||'';
    if(g.includes('בנים')&&g.includes('בנות'))return'מעורב';
    if(g.includes('בנות'))return'בנות'; if(g.includes('בנים'))return'בנים';}
  const n=norm(r.name);

const splitOf=()=>50; // חלוקת בנים/בנות בבתי ספר מעורבים — הערכה של 50/50 לצורך התצוגה בלבד

function linkAndBuild(){
  /* כל שורה בלשונית "שיבוץ קורסים" היא קבוצה נפרדת (אותו קורס יכול לרוץ כמה פעמים —
     בנים/בנות, רצועות שונות, בית ספר ייעודי כמו פרדס חנה ברצועה 4). קורס בלי שורה נשאר כקורס בסיסי. */
  CE=COURSES.flatMap(c=>{
    const list=ASSIGN_MAP[courseKey(c.name)];
    if(!list||!list.length) return [{...c,key:c.name}];
    return list.map((a,i)=>({...c,key:c.name+'#'+i,
      gender:  a.gender  || c.gender,
      slots:  (a.slots&&a.slots.length) ? a.slots : c.slots,
      teacher: a.teacher || c.teacher,
      school:  a.school  || c.school,
      status:  a.status  || c.status}));
  });
  /* בית ספר שהקורס שלו שובץ לרצועה 4 (יום רביעי) — נספר שם ולא ברצועה שבה נרשם בטופס
     (פרדס חנה נרשמה לשלישי 14:00, והועברה לרביעי). אצל שירה ההזזה נשמרת מקומית בלבד,
     לכן כאן היא נגזרת מהשיבוץ בגיליון. */
  CE.filter(c=>(c.slots||[]).includes(4)&&c.school).forEach(c=>{
    const reg=REGS.find(r=>ALIASES[r.name]&&c.school.includes(ALIASES[r.name]));
    if(reg) reg.slots=[4];
  });
}
const stripT=t=>t.replace(/[וי]/g,'').replace(/[אה]$/,'');
const tokEq=(x,y)=>{const a=stripT(x),b=stripT(y);
  /* כתיב חסר/מלא: ליגטי = ליגאטי — משווים גם בלי אותיות אהו"י (נוסף 4.10.2026) */
  const ca=x.replace(/[אהוי]/g,''), cb=y.replace(/[אהוי]/g,'');
  return a===b || (ca.length>=2&&ca===cb) || (a.length>=3&&b.length>=3&&a.slice(0,3)===b.slice(0,3))};
function nameMatch(a,b){
  const ta=norm(a).split(' ').filter(x=>x.length>1), tb=norm(b).split(' ').filter(x=>x.length>1);
  if(!ta.length||!tb.length) return false;
  const hit=ta.filter(x=>tb.some(y=>tokEq(x,y))).length;
  return hit>=Math.min(2,Math.min(ta.length,tb.length));
}
const curSlot=c=>(c.slots&&c.slots[0])||0;
const curGen=c=>c.gender||'';
const curSchool=c=>c.school||'';
const capOf=c=>c.cap>0?c.cap:GS;
function schoolsIn(sid,gen){
  return REGS.filter(r=>r.slots.includes(sid)).map(r=>{
    const g=genderOf(r);
    if(gen&&gen!=='שניהם'&&g!=='מעורב'&&g!==gen) return null;
    let n=r.students;
    if(g==='מעורב'&&gen==='בנים') n=Math.round(r.students*splitOf()/100);
    else if(g==='מעורב'&&gen==='בנות') n=r.students-Math.round(r.students*splitOf()/100);
    return {name:r.name,n,mixed:g==='מעורב'};
  }).filter(x=>x&&x.n>0);
}
function compute(){
  return SLOTS.map(s=>{
    const inSlot=REGS.filter(r=>r.slots.includes(s.id));
    let b=0,g=0;const bn=[],gn=[];
    inSlot.forEach(r=>{const gd=genderOf(r);
      if(gd==='בנים'){b+=r.students;bn.push([r.name,r.students])}
      else if(gd==='בנות'){g+=r.students;gn.push([r.name,r.students])}
      else{const p=splitOf(),x=Math.round(r.students*p/100);b+=x;g+=r.students-x;
        if(x)bn.push([r.name+' (מעורב)',x]); if(r.students-x)gn.push([r.name+' (מעורב)',r.students-x])}});
    const inS=CE.filter(c=>c.slots.includes(s.id));
    const bCo=inS.filter(c=>c.gender==='בנים').length;
    const gCo=inS.filter(c=>c.gender==='בנות').length;
    return {slot:s,b,g,bn,gn,n:inSlot.length,bCo,gCo,
      bNeed:Math.ceil(b/GS)||0,gNeed:Math.ceil(g/GS)||0};});
}
function uniqueStudents(){
  let b=0,g=0;
  REGS.forEach(r=>{ if(!r.slots.length) return; const gd=genderOf(r);
    if(gd==='בנים') b+=r.students;
    else if(gd==='בנות') g+=r.students;
    else {const x=Math.round(r.students*splitOf()/100); b+=x; g+=r.students-x;}});
  return {b,g,total:b+g};
}
const unslotted=()=>CE.filter(c=>!(c.slots&&c.slots.length));

function vSchedule(){

  const evs=[...SHEET_EVS].sort((a,b)=>(a.d||'9999').localeCompare(b.d||'9999'));
  const fmt=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||''); return m?m[3]+'.'+m[2]+'.'+m[1]:(d||'ללא תאריך');};

      <div class="t">${esc(e.t)} ${e.c?`<span class="tag t-slot">${esc(e.c)}</span>`:''}</div>
      <div class="d"><span class="ltr">${esc(fmt(e.d))}</span>${e.h?' · <span class="ltr">'+esc(e.h)+'</span>':''}${e.l?' · '+esc(e.l):''}</div>

function mlCopy(t,el,done){
  const old=el.textContent;
  const fb=()=>{const w=document.createElement('textarea');w.value=t;
    w.style.cssText='position:fixed;inset:auto 10px 10px 10px;height:180px;z-index:99';
    document.body.appendChild(w);w.select();setTimeout(()=>w.remove(),12000)};
  if(!navigator.clipboard) return fb();
  navigator.clipboard.writeText(t).then(()=>{
    el.textContent=done; setTimeout(()=>{el.textContent=old},2200);
  }).catch(fb);
}

function cmpSenderInfo(){
  const w=document.getElementById('sdWho');
  if(w&&w.value){const o=w.options[w.selectedIndex]; return {name:o.dataset.name||'',role:o.dataset.role||'',phone:o.dataset.phone||''};}
  return {name:'',role:'',phone:''};
}
function cmpWaLink(phone){
  let d=String(phone||'').replace(/\D/g,''); if(!d) return '';
  if(d.startsWith('0')) d='972'+d.slice(1); else if(!d.startsWith('972')) d='972'+d;
  return 'https://wa.me/'+d;
}

/* ---------- שליחה ישירה (Web App) — נוסף 7.10.2026 ----------

const SEND_URL='https://script.google.com/macros/s/AKfycbyn54UVJ3ALXQAv77DzUyFcB7JAxdniPbhKmbkhVruBOt4do4iBwkf8M-7CjDwD8P18IA/exec';

const sdLoadPin=()=>{try{return localStorage.getItem('chemed_sdpin')||''}catch(e){return ''}};
async function sendDirect(mode){
  const out=document.getElementById('sdOut'), who=document.getElementById('sdWho'), pin=(document.getElementById('sdPin').value||'').trim();
  const sel=cmpSelected();
  if(!sel.length) return alert('בחרי נמען אחד לפחות.');
  if(!cmp.subj.trim()) return alert('חסר נושא למייל.');
  if(!who||!who.value) return alert('בחרי מי שולח/ת (החתימה והתשובות לפי הבחירה).');
  if(!pin) return alert('הקלידי את קוד השליחה.');
  if(mode==='send'){
    if(!confirm('לשלוח עכשיו ל-'+sel.length+' נמענים?\nאי אפשר לבטל שליחה.\n(תקבלי גם עותק לדוגמה למייל שלך.)')) return;
  }
  const base={pin,role:TEACHER_MODE?'teacher':'team',sender:who.value,senderName:who.options[who.selectedIndex].dataset.name||'',logo:{b64:CMP_LOGO_B64,mime:'image/jpeg'},
    mails:sel.map(c=>({to:c.mail,name:c.name,subject:cmpFill(cmp.subj,c),html:cmpEmailHtml(c,true),body:cmpPlainFor(c)})),
    img:cmp.img?{name:cmp.img.name,mime:cmp.img.mime,mode:cmp.imgMode,b64:cmp.img.b64}:null};
  const post=async m=>{const r=await fetch(SEND_URL,{method:'POST',body:JSON.stringify(Object.assign({},base,{mode:m}))}); return r.json();};   // text/plain — בלי preflight
  const bad=j=>'<b style="color:#b3261e">לא נשלח:</b> '+esc(j.error||'שגיאה')+(j.rejected?'<br>'+j.rejected.map(esc).join(', '):'');
  const btns=['sdTest','sdSend'].map(id=>document.getElementById(id));
  btns.forEach(b=>b.disabled=true);
  try{
    if(mode==='test'){
      out.textContent='שולח בדיקה…';
      const j=await post('test');
      out.innerHTML=j.ok?'<b style="color:#0b5c40">✓ נשלח מייל בדיקה אל '+esc(j.sentTo)+'.</b>':bad(j);
    } else {
      out.textContent='שולח עותק לדוגמה אליך…';
      const t=await post('test');
      if(!t.ok){ out.innerHTML=bad(t); return; }
      out.textContent='שולח ל-'+sel.length+' נמענים…';
      const j=await post('send');
      out.innerHTML=j.ok?'<b style="color:#0b5c40">✓ נשלחו '+j.sent+' מיילים.</b> (עותק לדוגמה נשלח גם אליך.)'+(j.failed&&j.failed.length?'<br><b style="color:#b3261e">לא הצליחו:</b> '+j.failed.map(esc).join(' · '):''):bad(j);
    }
  }catch(e){
    out.innerHTML='<b style="color:#b3261e">שגיאת תקשורת:</b> '+esc(e.message)+' — בדקי חיבור לאינטרנט ונסי שוב.';
  }finally{
    btns.forEach(b=>b.disabled=false);
  }
}
function wireSend(){
  const t=document.getElementById('sdTest'), s=document.getElementById('sdSend');
  const pinEl=document.getElementById('sdPin'); if(pinEl) pinEl.oninput=()=>{try{localStorage.setItem('chemed_sdpin',pinEl.value)}catch(e){}};
  const w=document.getElementById('sdWho'); if(w) w.onchange=()=>cmpRefreshPrev();   /* החתימה בתצוגה מתעדכנת לפי השולח/ת */

}
function cmpScript(){
  const sel=cmpSelected();
  const rows=sel.map(c=>({name:c.name,to:c.mail,subject:cmpFill(cmp.subj,c),html:cmpEmailHtml(c,true),body:cmpPlainFor(c)}));
  const imgDef=cmp.img?JSON.stringify({name:cmp.img.name,mime:cmp.img.mime,mode:cmp.imgMode,b64:cmp.img.b64}):'null';
  return `/**
 * שליחת מייל מעוצב לנבחרים — קמפוס חמ"ד תשפ"ז
 * נוצר מלוח הניהול בתאריך ${new Date().toLocaleDateString('he-IL')} · ${rows.length} נמענים
 *
 * איך מריצים:
 *  1. מתחברים בדפדפן לחשבון הגוגל שממנו רוצים לשלוח (למשל החשבון הארגוני)
 *  2. פותחים script.google.com  ←  "פרויקט חדש", מוחקים את התוכן ומדביקים את כל הקובץ
 *  3. בוחרים את הפונקציה  run  ולוחצים "הפעלה", ומאשרים הרשאה בפעם הראשונה
 *
 * ברירת המחדל היא יצירת טיוטות ב-Gmail ולא שליחה. בודקים את הטיוטות,
 * ואז משנים את MODE ל-'send' ומריצים שוב.
 */

const MODE = 'drafts';        // 'drafts' = טיוטות | 'send' = שליחה בפועל
const CC   = '';              // כתובת להעתק. ריק = בלי העתק
const MAILS = ${JSON.stringify(rows,null,2)};
const IMG  = ${imgDef};   // תמונה מצורפת (או null). mode: 'inline' = בתוך המייל | 'attach' = קובץ מצורף
const LOGO = '${CMP_LOGO_B64}';   // לוגו החתימה

function mailOpts_(m) {
  const opts = { htmlBody: m.html };
  if (CC) opts.cc = CC;
  const inl = {};
  if (IMG) {
    const blob = Utilities.newBlob(Utilities.base64Decode(IMG.b64), IMG.mime, IMG.name);
    if (IMG.mode === 'inline') inl.img1 = blob; else opts.attachments = [blob];
  }
  if (LOGO) inl.logo = Utilities.newBlob(Utilities.base64Decode(LOGO), 'image/jpeg', 'logo.jpg');
  if (Object.keys(inl).length) opts.inlineImages = inl;
  return opts;
}

/** לוחצים הפעלה על אחת הפונקציות האלה — בלי לערוך שום שורה בקוד */
function createDrafts() { return runWith_('drafts'); }   // יוצר טיוטות ב-Gmail. לא שולח כלום
function sendAll()      { return runWith_('send'); }     // ⚠️ שולח בפועל לכל הנמענים. אי אפשר לבטל
function run()          { return runWith_(MODE); }       // לפי הערך של MODE למעלה (ברירת מחדל: טיוטות)

function runWith_(MODE) {
  if (MODE !== 'drafts' && MODE !== 'send') throw new Error('MODE חייב להיות drafts או send');
  let ok = 0;
  const failed = [];
  MAILS.forEach(function (m) {
    if (!m.to) { failed.push(m.name + ' — אין כתובת'); return; }
    try {
      const opts = mailOpts_(m);
      if (MODE === 'send') GmailApp.sendEmail(m.to, m.subject, m.body, opts);
      else GmailApp.createDraft(m.to, m.subject, m.body, opts);
      ok++;
    } catch (err) {
      failed.push(m.name + ' — ' + err.message);
    }
  });
  let msg = (MODE === 'send' ? 'נשלחו ' : 'נוצרו כטיוטות ') + ok + ' מתוך ' + MAILS.length + ' מיילים.';
  if (failed.length) msg += '\\n\\nלא הצליחו:\\n' + failed.join('\\n');
  Logger.log(msg);
  return msg;
}

}

/* כפתורי הרצועות של המורה הנבחר: רק בתי הספר של הרצועות (ומתחם בנים/בנות) שהוא מלמד בהן */
function tcRenderButtons(){
  const box=document.getElementById('tcButtons'), w=document.getElementById('sdWho'); if(!box) return;
  const email=w&&w.value?w.value.trim().toLowerCase():'';
  const t=email?TEACHERS.find(x=>String(x.email||'').trim().toLowerCase()===email):null;
  if(!t){ box.innerHTML='<div class="note">בחרו קודם את שמכם בשלב 1, ואז יופיעו כאן בתי הספר של הרצועות שלכם.</div>'; cmpHighlight(); return; }
  const pool=cmpPool(), combos=new Map();
  CE.filter(c=>c.teacher&&nameMatch(t.name,c.teacher)&&curSlot(c)).forEach(c=>{
    const g=curGen(c), gs=(g==='בנים'||g==='בנות')?[g]:['בנים','בנות'];
    gs.forEach(x=>combos.set(curSlot(c)+'|'+x,{sid:curSlot(c),g:x}));});
  const list=[...combos.values()].sort((a,b)=>a.sid-b.sid||a.g.localeCompare(b.g,'he'));
  if(!list.length){ box.innerHTML='<div class="note">לא נמצא שיבוץ שלכם בקורסים. אפשר לבחור בתי ספר ידנית מהרשימה למטה.</div>'; cmpHighlight(); return; }
  box.innerHTML='<div class="sub">בתי הספר ברצועות שלך (לחיצה בוחרת רק אותם, לחיצה נוספת מבטלת):</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">'
    +list.map(o=>{const sl=SLOTS[o.sid-1], n=cmpSchoolSlotIds(pool,o.sid,o.g).length;
      return `<button class="btn ghost" data-cmpsch="${o.sid}" data-cmpgen="${o.g}" title="${sl.time}">${esc(sl.label)}${sl.day&&sl.day!=='שלישי'?' (יום '+esc(sl.day)+')':''} ${o.g} · בתי ספר (${n})</button>`;}).join('')+'</div>';
  box.querySelectorAll('[data-cmpsch]').forEach(b=>b.onclick=()=>{
    const ids=cmpSchoolSlotIds(cmpPool(),+b.dataset.cmpsch,b.dataset.cmpgen||'');
    if(!ids.length) return alert('אין בתי ספר עם כתובת מייל בבחירה הזו.');
    const cur=cmpSelected().map(x=>x.id), same=cur.length===ids.length&&ids.every(i=>cur.includes(i));
    cmp.sel=same?[]:ids.slice(); cmpSave(); cmpRefresh();});
  cmpHighlight();
}

    +'<div id="tcErr" style="color:#b3261e;font-size:12.5px;min-height:18px;margin:6px 0"></div>'
    +'<button class="btn" style="width:100%;padding:10px;border-radius:10px">כניסה</button></form>';
  document.body.appendChild(ov);

const TABS=[{k:'assign',n:'לוח שיבוץ'},{k:'courses',n:'קורסים ובתי ספר'},

const fmtAt=iso=>{const d=new Date(iso);

async function fetchLive(){

let __busy=false, __last=0, __auto=null;
/* quiet===true: רענון אוטומטי ברקע — בלי הבהוב, בלי לאבד גלילה/חיפוש, ובלי למחוק נתונים אם קריאה נכשלה */
async function boot(quiet){
  quiet=(quiet===true);
  if(__busy) return; __busy=true;
  const btn=document.getElementById('btnSync');
  if(!quiet){ document.getElementById('err').innerHTML=''; btn.textContent='מרענן…'; btn.disabled=true; }
  try{
    if(!TEACHER_MODE){ const sp=await sheetViewPw();   /* סיסמה שהוחלפה בגיליון מנתקת מכשירים שזכרו את הקודמת */
      if(sp){ let st=''; try{ st=localStorage.getItem('chemedViewSig')||''; }catch(e){}
        if(sha256hex(sp)!==st){ try{ sessionStorage.removeItem('chemedView'); localStorage.removeItem('chemedViewUntil'); localStorage.removeItem('chemedViewSig'); }catch(e){} location.reload(); return; } } }
    const d=await fetchLive();
    buildData(parseSheet(d.main));
    try{ CONTACT_ROWS=await getRows('contacts'); }catch(e){ console.warn('contacts feed',e); }
    applyContactOverlay();
    const prevA=ASSIGN_MAP, prevT=TEAM;
    ASSIGN_MAP=await getAssignMap();
    TEAM=await getTeam();
    { const tt=teamFromContacts(); if(tt.length) TEAM=tt; }   /* מקור הצוות: לשונית "אנשי קשר מסודר" (שורות מסוג "צוות ניהול"); הלשונית הישנה "צוות ניהול" רק כגיבוי */
    if(quiet){
      if(!Object.keys(ASSIGN_MAP).length && Object.keys(prevA).length) ASSIGN_MAP=prevA;

    }

    linkAndBuild();
    bar('live','<b>מחובר לגיליון.</b> הנתונים נטענו ישירות מהגיליון · עודכן: '+fmtAt(d.at)+'. מתעדכן אוטומטית כל כמה דקות.');
    const y=window.scrollY, q=(document.getElementById('ccSearch')||{}).value;
    if(!(quiet&&(tab==='compose'||TEACHER_MODE))) render();   /* לא מרנדרים מחדש תוך כדי כתיבת מייל */
    const cs=document.getElementById('ccSearch');
    if(quiet&&cs&&q){ cs.value=q; cs.dispatchEvent(new Event('input')); }
    if(quiet) window.scrollTo(0,y);
    __last=Date.now();
  }catch(e){
    console.warn('live load failed',e);
    if(!quiet) bar('bad','<b>לא הצלחתי להתחבר לגיליון כרגע</b> ('+esc(e.message)+'). רעני את הדף בעוד רגע — הדף הזה תמיד קורא נתונים חיים ואינו שומר עותק מקומי.');
  }
  if(!quiet){ btn.textContent='🔄 רענון מהגיליון'; btn.disabled=false; }
  __busy=false; startAuto();
}
function startAuto(){
  if(__auto) return;

    if(document.visibilityState==='visible' && Date.now()-__last>60000) boot(true); });     // חזרה ללשונית
}

/* ---------- שער סיסמה (4.10.2026) ----------
   הדף לא טוען שום נתון מהגיליון עד שמקלידים סיסמה. זה שער נגד כניסה מקרית,
   לא הגנה חזקה: הסיסמה נבדקת בדפדפן (נשמרת רק ה-hash שלה בקוד). */
const PW_HASH='a57a6568b3fa37affb410beadc46e507fde9b3bd9a1616d22f113ec18ca22b13';
/* SHA-256 בג'אווהסקריפט רגיל — עובד גם כשהדף נפתח כקובץ או בכתובת לא מאובטחת (בלי crypto.subtle) */
function sha256hex(msg){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));
  const bytes=[...new TextEncoder().encode(msg)], l=bytes.length*8;
  bytes.push(0x80); while(bytes.length%64!==56) bytes.push(0);
  for(let i=7;i>=0;i--) bytes.push(i>=4?0:(l>>>(i*8))&255);
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  for(let o=0;o<bytes.length;o+=64){
    const w=new Array(64);
    for(let i=0;i<16;i++) w[i]=(bytes[o+i*4]<<24)|(bytes[o+i*4+1]<<16)|(bytes[o+i*4+2]<<8)|bytes[o+i*4+3];
    for(let i=16;i<64;i++){const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3), s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
    let [a,b,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){
      const S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g), t1=(hh+S1+ch+K[i]+w[i])|0;
      const S0=rr(a,2)^rr(a,13)^rr(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)|0;
      hh=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    h=[(h[0]+a)|0,(h[1]+b)|0,(h[2]+c)|0,(h[3]+d)|0,(h[4]+e)|0,(h[5]+f)|0,(h[6]+g)|0,(h[7]+hh)|0];
  }
  return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
function unlocked(){
  try{ if(sessionStorage.getItem('chemedView')==='1') return true; }catch(e){}

}
/* סיסמת הכניסה לדף: אם בלשונית "הגדרות" יש שורה "סיסמת דף הצפייה" — היא הסיסמה (ניתנת לשינוי בגיליון).
   אם אין — הסיסמה המובנית בקוד (hash). שער נגד כניסה מקרית בלבד: הגיליון עצמו קריא למי שיש לו את הקישור שלו. */
async function sheetViewPw(){

    for(const r of rows){ if(String(r[0]||'').includes('סיסמת דף הצפייה')){ const v=String(r[1]||'').trim(); if(v) return v; } }
  }catch(e){ console.warn('settings feed',e); }

}
function showGate(){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:9999;background:#f4f5fb;display:flex;align-items:center;justify-content:center;padding:16px';
  ov.innerHTML='<form style="background:#fff;border:1px solid #dfe2f0;border-radius:16px;padding:26px 24px;width:100%;max-width:340px;text-align:center;box-shadow:0 8px 30px rgba(40,50,110,.12)">'
    +iconBox(ICON_LOCK,84)+'<h2 style="margin:10px 0 4px;font-size:18px">קמפוס חמ"ד — דף צפייה</h2>'
    +'<div style="font-size:13px;color:#667;margin-bottom:14px">דף פנימי לצוות הניהול. הקלידי סיסמה כדי להיכנס.</div>'
    +'<input type="text" id="pwIn" name="chemed-code" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="סיסמה" style="width:100%;box-sizing:border-box;padding:10px 12px;font:inherit;border:1px solid #cfd3e6;border-radius:10px;text-align:center;direction:ltr">'
    +'<div id="pwErr" style="color:#b3261e;font-size:12.5px;min-height:18px;margin:6px 0"></div>'
    +'<button class="btn" style="width:100%;padding:10px;border-radius:10px">כניסה</button></form>';
  document.body.appendChild(ov);
  const f=ov.querySelector('form'), inp=ov.querySelector('#pwIn'), err=ov.querySelector('#pwErr');
  inp.focus();
  f.onsubmit=async e=>{ e.preventDefault();
    const typed=inp.value.trim(); err.textContent='בודק…';
    let ok=false; try{ const sp=await sheetViewPw(); ok=sp?(typed===sp):(sha256hex(typed)===PW_HASH); }catch(x){ err.textContent='הדפדפן לא תומך בבדיקת סיסמה'; return; }
    if(!ok){ err.textContent='סיסמה שגויה'; inp.select(); return; }
    try{ localStorage.setItem('chemedViewSig',sha256hex(typed)); }catch(x){}
    try{ sessionStorage.setItem('chemedView','1'); }catch(x){}
    try{ localStorage.setItem('chemedViewUntil',String(Date.now()+30*864e5)); }catch(x){}
    ov.remove(); boot(); };
}
